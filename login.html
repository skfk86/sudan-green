<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }
        
        :root{
            --body-Dark: rgb(85, 168, 150);
            --navbar-Dark: aquamarine;
            --text-Dark:  black;

        }
        body.dark{
            --body-Dark:  rgb(32, 32, 32);
            --navbar-Dark:  rgb(32, 32, 32) ;
            --text-Dark: rgb(85, 168, 150);
            --box-shadow: #fff;
        }
        header{
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: var(--navbar-Dark);
            align-items: center;
            color: var(--text-Dark);
            box-shadow: 0 0 10px var(--box-shadow);
        }
        header button{
            font-size: 20px;
            border: none;
            padding: 10px;
            border-radius: 50%;
            background-color:   rgb(85, 168, 150);
            color: azure;
        }
        body{
            background-color: var(--body-Dark);
        }
        main{
            text-align: center;
            padding: 40px 10px;
            color: beige;
        }
        main button{
            box-shadow: 0 0 2px var(--box-shadow);
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            margin: 10px auto;
            border: 2px solid azure;
            background-color:   rgb(85, 168, 150);
            color: azure;
            font-size: larger;
            font-weight: 700;
        }
         main button:hover{
            color: rgb(85, 168, 150);
            background-color: azure;
            border: 2px solid rgb(85, 168, 150);
         }
        .faq{
            padding: 10px 24px;
            width: 250px;
            margin: auto;
            border-radius: 6px;
            background-color: var(--navbar-Dark);
            color: var(--text-Dark);
            box-shadow: 0 0 2px var(--box-shadow);
            display: none;
        }
        .item .question{
            padding: 5px;
            border-radius: 6px;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            direction: rtl;
            background-color:   rgb(85, 168, 150);
            color: azure;
            cursor: pointer;
            margin: 10px 0;
        }
        .item .question:hover{
            background-color: azure;
            color:  rgb(85, 168, 150);
        }
        .faq .item .answer{
            background-color: azure;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            color: rgb(0, 0, 0, 0.7);
            padding: 5px;
            display: none;
        }
        .show{
            display: block !important;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">Alosh</h1>
        <div class="btn">
            <button id="btn" onclick="Darkthem()">W</button>
        </div>
    </header>
    <main>
        <h1>Hello world</h1>
        <button id="Go">فتح القائمة</button>
        <div class="faq" id="faq">
           <!-- السؤال الأول -->
           <div class="item">
             <div class="question" id="qu">ما هي HTML؟</div>
             <div class="answer">هي اللغة المسؤولة عن بناء هيكل الموقع.</div>
           </div>
         
           <!-- السؤال الثاني -->
           <div class="item">
             <div class="question">ما هي CSS؟</div>
             <div class="answer">هي اللغة المسؤولة عن تصميم وتنسيق الموقع.</div>
           </div>
         </div>
    </main>
</body>
<script>
 const btn = document.getElementById("btn")
 btn.addEventListener("click", ()=>{
    // حلب ال body
    let body = document.body
    // تغير الخلفية عند ضغط الزر
     let background = body.classList.toggle("dark")
    // حفظ الوضع ومعرفة الوصع
   let isDark = body.classList.contains("dark")
   if (isDark) {
    localStorage.setItem("them", "dark")
     btn.innerHTML = '<i class="fa-regular fa-moon"></i>'
   }else{
    localStorage.setItem("them", "light")
     btn.innerHTML = '<i class="fa-regular fa-sun"></i>'
   }
 })
 let them = localStorage.getItem("them")
 if (them === "dark") {
    document.body.classList.add("dark")
    btn.innerHTML =  '<i class="fa-regular fa-moon"></i>'
 }else{
    document.body.classList.remove("dark")
    btn.innerHTML = '<i class="fa-regular fa-sun"></i>'
 }
//  جلب الزر الخاص بفتج القائمة المسندلة
const menuBtn = document.getElementById("Go")
// فتج القائمة عند الضغط على الزر
menuBtn.addEventListener("click" , ()=>{
    document.getElementById("faq").classList.toggle("show")
})
// السؤال
let qut = document.querySelectorAll(".question")
// الجواب
let answer = document.querySelectorAll(".answer")
// اظهار الجواب عند الضغط على السؤال
qut.forEach((e, index)=>{

    e.addEventListener("click", ()=>{

        answer.forEach((a , i)=>{
            if(i !== index){
                a.classList.remove("show")
            }
        }) 
        answer[index].classList.toggle("show")

    })
})
for (const [index , i] of qut.entries()) {
    console.log(index)
}
    
</script>
</html>
