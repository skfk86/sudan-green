<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- link style -->
     <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95%;
            margin: auto;
        }
        nav ul{
            display: flex;
            justify-content: center;
            align-items: center;
            gap:25px;
            list-style: none;
            font-size: 20px;
        }
        nav ul li a{
            text-decoration: none;
            color: black;
        }
        .sidebar{
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 250px;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            list-style: none;
            flex-direction: column;
            z-index: 999;
            padding: 20px 10px;
            background-color: burlywood;
            display: none;

        }
        .sidebar .item{
            height: 50px;
            width: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        .sidebar .item:hover{
            background-color: #fff;
        }
        .sidebar li a{
            text-decoration: none;
            color: black;

        }
        .show{
            display: block;
        }
        .hidden{
            display: none;
        }

        #menuBtn{
            display: none;
        }
        @media (max-width: 600px) {
            #menuBtn{
                display: block;
            }
            .navbar li{
                display: none;
            }
        }


     </style>
</head>
<body>
    <nav>
        <h1 class="logo">Navbr</h1>
        <ul class="navbar">
            <li><a href="#">home</a></li>
            <li><a href="#"> home</a></li>
            <li><a href="#">home</a></li>
            <li><a href="#">home</a></li>
            <li id="menuBtn"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
        </ul>
    </nav>
    <ul class="sidebar">
        <li  id="close"><a href="#"><i class="fa-solid fa-xmark"></i></a></li>
            <li class="item"><a href="#">home</a></li>
            <li class="item"><a href="#"> home</a></li>
            <li class="item"><a href="#">home</a></li>
            <li class="item"><a href="#">home</a></li>
        </ul>


</body>
<script>
    const btn = document.getElementById("menuBtn")
    btn.addEventListener("click", ()=>{
       let menu = document.querySelector(".sidebar").classList.add("show")
       document.querySelector(".sidebar").classList.remove("hidden")
    })
    const close = document.getElementById("close").addEventListener("click", ()=>{
        document.querySelector(".sidebar").classList.add("hidden")
        document.querySelector(".sidebar").classList.remove("show")
    })
</script>
</html>
