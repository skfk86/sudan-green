<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: antiquewhite;

        }
        .navbar{
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
        }
        .navbar li a{
            text-decoration: none;
            font-size: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: black;
        }
           .navbar li a:hover{
            color: rgba(0, 0, 0, 0.705);
           }
           .sidebar{
            position: fixed;
            top: 0;
            right: 0;
            height:100vh ;
            width: 250px;
            padding: 10px 20px;
            background-color: rgba(238, 130, 238, 0.404);
            display: none;
            align-items: center;
            list-style: none;
            flex-direction: column;
           }
           .sidebar li{
            height: 50px;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
           }
           .sidebar li a{
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            color: black;
           }
           .item:hover{
            background-color: aliceblue;
           }
           

    </style>
</head>
<body>
    <header>
        <h1 class="logo">My webside</h1>
        <ul class="navbar">
        <li><a href="#">home</a></li>
        <li><a href="#">about</a></li>
        <li><a href="#">conact</a></li>
        <li><a href="#">servecis</a></li>
        <li id="menuBtn"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
    </ul>
    </header>

     <ul class="sidebar" id="sidebar">
        <li id="close"><a href="#"><i class="fa-solid fa-xmark"></i></a></li>
        <li class="item"><a href="#">home</a></li>
        <li class="item"><a href="#">about</a></li>
        <li class="item"><a href="#">conact</a></li>
        <li class="item"><a href="#">servecis</a></li>
    </ul>
    
</body>
<script>
    function closeMenu(id , elm){
       return document.getElementById(id).style.display = elm
    }
    const menuBtn = document.getElementById("menuBtn")
    menuBtn.addEventListener("click", () =>{
        closeMenu("sidebar" , "flex")
    })
    let close = document.getElementById("close").addEventListener("click",()=>{
         closeMenu("sidebar" , "none")
    })


</script>
</html>
