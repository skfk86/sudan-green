<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14301F">
<title>السودان الأخضر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --forest:#14301F; --forest2:#24503A; --green:#1F6B45; --green-soft:#E3F1E8;
  --rain:#2A6496; --rain-soft:#E1EDF7; --gold:#E9B949; --gold-soft:#F6EBD0; --gold-ink:#7A560F;
  --clay:#9A4426; --clay-soft:#F7E4DC; --violet:#4F468F; --violet-soft:#EDEAF6;
  --sand:#F5F2EA; --card:#FFFFFF; --line:#E6E1D3; --ink:#1C2A22; --muted:#5E6B62; --muted2:#6B6A60;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sand);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:15px}
h1,h2,h3,.disp{font-family:'Readex Pro',sans-serif;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:24px}
.page{padding:calc(20px + var(--safe-t)) 20px 0}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.muted{color:var(--muted)}.small{font-size:12.5px}.bold{font-weight:700}
.title{font-size:24px;font-weight:700;color:var(--forest)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.hero{background:var(--forest);color:var(--sand);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero .deco{position:absolute;left:-18px;bottom:-22px;opacity:.14}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.ibox{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{height:50px;border-radius:15px;border:0;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--green);color:#fff}
.btn.gold{background:var(--gold);color:var(--forest)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.seg{display:flex;background:#ECE7DA;border-radius:14px;padding:4px}
.seg button{flex:1;height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;font-size:13px}
.seg button.on{background:#fff;color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{height:6px;border-radius:999px;background:#EEEAE0;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--green)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.input{height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;outline:0;width:100%}
.input:focus{border-color:var(--green)}
textarea.input{height:auto;padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.section{margin:22px 20px 10px}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .ibox{margin:0 auto 10px;width:56px;height:56px;border-radius:18px}
nav.tabs{flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-b))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;min-height:48px;color:var(--muted2);font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--green);font-weight:700}
.toast{position:fixed;left:20px;right:20px;bottom:calc(90px + var(--safe-b));background:var(--forest);color:#fff;border-radius:14px;padding:14px 16px;font-weight:600;z-index:9999;transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}
.toast.show{transform:none;opacity:1}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.article h2{font-size:18px;margin:20px 0 6px;color:var(--forest)}
.article p,.article li{line-height:1.85;font-size:15.5px;color:#2C3A31}
.article ul,.article ol{padding-inline-start:20px}
#map{position:absolute;inset:0;z-index:1;background:#E9E4D6}
.map-wrap{position:relative;height:100%}
.map-top{position:absolute;top:calc(14px + var(--safe-t));left:16px;right:16px;z-index:500;display:flex;gap:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:500;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(20,48,31,.12);padding:10px 20px 14px;max-height:46%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 10px}
.leaflet-container{font-family:inherit}
.tree-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--green);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.marker-cluster div{background:var(--green)!important;color:#fff;font-weight:700;font-family:'Readex Pro'}
.marker-cluster{background:rgba(31,107,69,.3)!important}
.month{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.month.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.dot{width:6px;height:6px;border-radius:50%}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;text-align:center}
.badge span{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.badge .got{background:var(--gold-soft);border:2px solid var(--gold)}
.badge .lock{background:#EEEAE0;border:2px dashed #CFC7B2}
.lb-head{background:var(--forest);color:var(--sand);padding:calc(20px + var(--safe-t)) 20px 18px;border-radius:0 0 28px 28px}
.lb-head .seg{background:var(--forest2)}
.lb-head .seg button{color:#CDEBD8}
.lb-head .seg button.on{background:var(--sand);color:var(--forest)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.photo-pick{height:160px;border-radius:18px;border:2px dashed #CFC7B2;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);overflow:hidden;width:100%}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>

const ICONS = {

  tree:'<path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"/><path d="M12 22v-3"/>',
  leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',

  wind:'<path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/>',

  locate:'<line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',

const ic = (n, s = 20, c = 'currentColor', w = 1.9) =>
  `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

/* ===================== أدوات ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ar-EG');
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function haptic() { try { Plugins.Haptics && Plugins.Haptics.impact({ style: 'LIGHT' }); } catch (e) {} }
const loading = () => '<div class="spinner" role="progressbar" aria-label="جارٍ التحميل"></div>';
function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const l of lines) {
    if (/^## /.test(l)) { close(); out += `<h2>${inline(l.slice(3))}</h2>`; }
    else if (/^- /.test(l)) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(l.slice(2))}</li>`; }
    else if (/^\d+\. /.test(l)) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(l.replace(/^\d+\. /, ''))}</li>`; }
    else if (l.trim() === '') close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return out;
}
const CAT = { rain:['المطر','var(--rain)','var(--rain-soft)','rain'], farm:['الزراعة','var(--green)','var(--green-soft)','sprout'], env:['البيئة','var(--gold-ink)','var(--gold-soft)','leaf'] };

/* ===================== الحالة ===================== */
const S = { user: null, profile: null, species: [], tab: 'home' };

async function loadProfile() {
  if (!S.user) return;
  const { data } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
  S.profile = data;
}
async function loadSpecies() {
  if (S.species.length) return;
  const { data } = await sb.from('tree_species').select('*').order('id');
  S.species = data || [];
}

/* ===================== التوجيه ===================== */
const TABS = [['home','الرئيسية','home'],['articles','تعلّم','book'],['map','الخريطة','map'],['mytrees','أشجاري','sprout'],['season','التقويم','calendar']];
const ROUTES = {};
let stack = [];
function go(name, params = {}, replace = false) {
  if (replace) stack.pop();
  stack.push({ name, params });
  history.pushState({ d: stack.length }, '');
  render();
}
function back() { if (stack.length > 1) { stack.pop(); render(); } }
window.addEventListener('popstate', () => { if (stack.length > 1) { stack.pop(); render(); } else history.pushState({}, ''); });
if (Plugins.App) Plugins.App.addListener('backButton', () => { if (stack.length > 1) { stack.pop(); render(); } else Plugins.App.exitApp(); });

function renderTabs(active) {
  const nav = $('#tabs');
  if (!active) { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  nav.innerHTML = TABS.map(([id, label, icon]) =>
    `<button class="${id === active ? 'on' : ''}" data-tab="${id}" aria-current="${id === active ? 'page' : 'false'}">${ic(icon, 24)}${label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { stack = []; go(b.dataset.tab); });
}
async function render() {
  const cur = stack[stack.length - 1] || { name: 'home', params: {} };
  const r = ROUTES[cur.name];
  if (r.auth && !S.user) { stack = [{ name: 'login', params: {} }]; return render(); }
  renderTabs(r.tab);
  const view = $('#view');
  view.scrollTop = 0;
  view.style.overflowY = r.full ? 'hidden' : 'auto';
  view.style.paddingBottom = r.full ? '0' : '24px';
  view.innerHTML = loading();
  try { await r.render(view, cur.params); }
  catch (e) { console.error(e); view.innerHTML = `<div class="empty"><p>حدث خطأ، تحقق من اتصالك بالإنترنت.</p><button class="btn ghost" onclick="render()">إعادة المحاولة</button></div>`; }
}

const topBar = (title, right = '') => `
  <div class="page row" style="padding-bottom:4px">
    <button class="ibtn" aria-label="رجوع" onclick="back()">${ic('back')}</button>
    <h1 style="flex:1;font-size:21px;color:var(--forest)">${title}</h1>${right}
  </div>`;

/* ===================== تسجيل الدخول ===================== */
ROUTES.login = { render(v) {
  let mode = 'in';
  const draw = () => {
    v.innerHTML = `
    <div class="page" style="padding-top:calc(48px + var(--safe-t))">
      <div class="ibox" style="width:64px;height:64px;border-radius:20px;background:var(--forest)">${ic('tree', 32, '#9FD3B4')}</div>
      <h1 class="title" style="margin-top:18px;font-size:28px">السودان الأخضر</h1>
      <p class="sub" style="font-size:15px;line-height:1.7">ازرع شجرة، تابع نموها، وشارك في تخضير بلدك.</p>

/* ===================== تسجيل شجرة ===================== */
async function getPosition() {
  if (Plugins.Geolocation) {
    try { await Plugins.Geolocation.requestPermissions(); } catch (e) {}
    const p = await Plugins.Geolocation.getCurrentPosition({ enableHighAccuracy: true, timeout: 15000 });
    return { lat: p.coords.latitude, lng: p.coords.longitude };
  }
  return new Promise((res, rej) => navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), rej, { enableHighAccuracy: true, timeout: 15000 }));
}
async function reverseGeocode(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ar&zoom=12`);
    const j = await r.json(); const a = j.address || {};
    const rawState = (a.state || '').replace(/^ولاية\s*/, '');
    const state = SUDAN_STATES.find(s => rawState.includes(s) || s.includes(rawState)) || '';
    return { state, city: a.city || a.town || a.village || a.county || '' };
  } catch (e) { return { state: '', city: '' }; }
}
async function pickPhoto() {
  if (Plugins.Camera) {
    const img = await Plugins.Camera.getPhoto({ quality: 70, width: 1280, resultType: 'base64', source: 'PROMPT', promptLabelHeader: 'صورة الشجرة', promptLabelPhoto: 'من المعرض', promptLabelPicture: 'التقاط صورة', promptLabelCancel: 'إلغاء' });
    const bin = atob(img.base64String); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: 'image/' + (img.format === 'png' ? 'png' : 'jpeg') });
  }
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
    inp.onchange = () => res(inp.files[0] || null); inp.click();
  });
}

let mapObj = null;
ROUTES.map = { tab: 'map', full: true, async render(v) {

        <input id="mq" list="places" placeholder="ابحث عن ولاية أو مدينة" style="flex:1;border:0;outline:0;background:transparent;min-width:0"><datalist id="places"></datalist></div>
      <button class="ibtn" id="me" aria-label="موقعي" style="width:48px;height:48px;border:0;box-shadow:0 2px 10px rgba(20,48,31,.1)">${ic('locate', 20, 'var(--green)', 2)}</button>
    </div>

  </div>`;
  if (mapObj) { mapObj.remove(); mapObj = null; }
  mapObj = L.map('map', { zoomControl: false, attributionControl: true }).setView([15.6, 30.2], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapObj);
  const pinIcon = L.divIcon({ className: '', html: '<div class="tree-pin"></div>', iconSize: [30, 30], iconAnchor: [15, 30] });
  const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 50 });
  mapObj.addLayer(cluster);

  const [{ data: pts }, { data: states }, { data: cities }] = await Promise.all([
    sb.from('trees_map').select('id,species,nickname,city,state,lat,lng,photo_url,planted_at').limit(5000),
    sb.from('leaderboard_states').select('*').order('trees', { ascending: false }),
    sb.from('leaderboard_cities').select('*').order('trees', { ascending: false })
  ]);
  (pts || []).forEach(t => {
    const m = L.marker([t.lat, t.lng], { icon: pinIcon });
    m.bindPopup(`<div style="direction:rtl;text-align:right;font-family:inherit;min-width:150px">
      ${t.photo_url ? `<img src="${esc(t.photo_url)}" alt="" style="width:100%;height:90px;object-fit:cover;border-radius:10px;margin-bottom:6px">` : ''}
      <strong>${esc(t.nickname || t.species || 'شجرة')}</strong><br><span style="color:#5E6B62">${esc(t.city)}، ${esc(t.state)} · ${ageText(t.planted_at)}</span></div>`);
    cluster.addLayer(m);
  });
  const total = (states || []).reduce((s, r) => s + Number(r.trees), 0);
  let mode = 'states';
  const drawSheet = () => {
    const rows = (mode === 'states' ? states : cities) || [];
    const max = Math.max(1, ...rows.map(r => Number(r.trees)));
    $('#sheet').innerHTML = `<div class="grab"></div>
      <div class="between" style="align-items:flex-end"><div><div class="small muted">أشجار زرعها المجتمع</div>
      <div class="disp" style="font-size:28px;font-weight:700;color:var(--forest)">${fmt(total)}</div></div>
      <div class="seg" style="padding:3px"><button class="${mode === 'states' ? 'on' : ''}" data-m="states" style="padding:0 14px;height:36px">الولايات</button><button class="${mode === 'cities' ? 'on' : ''}" data-m="cities" style="padding:0 14px;height:36px">المدن</button></div></div>
      <ol style="list-style:none;margin:10px 0 0;padding:0">${rows.slice(0, 10).map((r, i) => `
        <li><button data-zoom="${esc(mode === 'states' ? r.state : r.city)}" class="row" style="width:100%;height:46px;border:0;border-bottom:1px solid #F0ECE2;background:none;gap:10px;text-align:right">
          <span class="bold muted" style="width:22px">${fmt(i + 1)}</span><span style="flex:1">${esc(mode === 'states' ? r.state : r.city)}</span>
          <span class="bar" style="flex:0 0 80px"><i style="width:${Math.round(100 * r.trees / max)}%"></i></span>
          <span class="bold" style="width:52px;text-align:left">${fmt(r.trees)}</span></button></li>`).join('') || '<li class="empty">لا توجد أشجار بعد. كن أول من يزرع!</li>'}</ol>`;
    $('#sheet').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; drawSheet(); });
    $('#sheet').querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => zoomTo(b.dataset.zoom));
  };
  const zoomTo = name => {
    const sel = (pts || []).filter(t => t.state === name || t.city === name);
    if (sel.length) mapObj.fitBounds(L.latLngBounds(sel.map(t => [t.lat, t.lng])).pad(.3), { maxZoom: 14 });
    else toast('لا توجد أشجار في ' + name + ' بعد');
  };
  drawSheet();
  $('#places').innerHTML = [...new Set([...SUDAN_STATES, ...(cities || []).map(c => c.city)])].map(p => `<option value="${esc(p)}">`).join('');
  $('#mq').onchange = e => e.target.value && zoomTo(e.target.value.trim());
  $('#me').onclick = async () => { try { const p = await getPosition(); mapObj.setView([p.lat, p.lng], 14); L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#2A6496', fillOpacity: 1 }).addTo(mapObj); } catch (e) { toast('تعذّر تحديد موقعك'); } };
  setTimeout(() => mapObj.invalidateSize(), 100);
}};

    e.preventDefault();
    const { error } = await sb.from('profiles').update({ display_name: $('#dn').value.trim() || 'زارع', state: $('#ps').value || null, city: $('#pc').value.trim() || null }).eq('id', S.user.id);
    toast(error ? 'تعذّر الحفظ' : 'تم الحفظ');
  };
  $('#lo').onclick = async () => { await sb.auth.signOut(); };
}};

/* ===================== التشغيل ===================== */
(async () => {
  try { Plugins.StatusBar && (await Plugins.StatusBar.setBackgroundColor({ color: '#F5F2EA' }), await Plugins.StatusBar.setStyle({ style: 'LIGHT' })); } catch (e) {}
  const { data: { session } } = await sb.auth.getSession();
  S.user = session ? session.user : null;
  sb.auth.onAuthStateChange((ev, session) => {
    const was = !!S.user; S.user = session ? session.user : null;
    if (ev === 'SIGNED_IN' && !was) { stack = []; go('home'); }
    if (ev === 'SIGNED_OUT') { S.profile = null; stack = []; go('login'); }
  });
  history.replaceState({}, ''); go(S.user ? 'home' : 'login');
  try { Plugins.SplashScreen && Plugins.SplashScreen.hide(); } catch (e) {}
})();
</script>
</body>
</html>
