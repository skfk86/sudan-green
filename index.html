<svg viewBox="0 0 500 450" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- تدرجات الألوان المتناسقة مع الموقع -->
    <linearGradient id="contactBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#394bee" />
      <stop offset="100%" stop-color="#1e2ea8" />
    </linearGradient>
    <linearGradient id="contactGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38cf9d" />
      <stop offset="100%" stop-color="#1ea87a" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#111111" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- هالة خلفية ناعمة -->
  <circle cx="250" cy="225" r="165" fill="#f0f4ff" />
  <circle cx="100" cy="120" r="35" fill="#e8fbf4" />

  <!-- خطوط مسار انطلاق الطائرة (Dash Lines) -->
  <path d="M120,310 C180,310 180,180 320,150" fill="none" stroke="#38cf9d" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.8" />

  <!-- صندوق المظروف الأساسي (Mail Card) -->
  <g filter="url(#softShadow)">
    <rect x="110" y="190" width="240" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- طيات المظروف الخلفية والداخلية -->
    <path d="M110,195 L230,285 L350,195" fill="none" stroke="#394bee" stroke-width="2" opacity="0.2" />
    <path d="M110,340 L195,260" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M350,340 L265,260" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- ورقة الرسالة الخارجة من المظروف -->
    <rect x="140" y="140" width="180" height="100" rx="10" fill="#ffffff" filter="url(#softShadow)" />
    <!-- أسطر كتابة الرسالة -->
    <rect x="160" y="162" width="70" height="7" rx="3.5" fill="#394bee" />
    <rect x="160" y="180" width="140" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="160" y="195" width="110" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="160" y="210" width="80" height="5" rx="2.5" fill="#38cf9d" />

    <!-- ختم دائري على المظروف -->
    <circle cx="230" cy="285" r="18" fill="url(#contactGreen)" />
    <path d="M224,285 L228,289 L237,280" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- طائرة ورقية منطلقة (رمز إرسال الرسائل) -->
  <g filter="url(#softShadow)">
    <polygon points="320,135 385,95 365,160 345,145" fill="url(#contactBlue)" />
    <polygon points="345,145 385,95 338,138" fill="#2938c4" />
  </g>

  <!-- فقاعة دردشة علوية (Chat Bubble) -->
  <g filter="url(#softShadow)">
    <rect x="75" y="85" width="105" height="55" rx="14" fill="#ffffff" />
    <!-- ذيل الفقاعة -->
    <path d="M100,140 L100,150 L115,140 Z" fill="#ffffff" />
    <!-- نقاط الدردشة المتحركة -->
    <circle cx="105" cy="112" r="5" fill="#38cf9d" />
    <circle cx="127" cy="112" r="5" fill="#394bee" />
    <circle cx="149" cy="112" r="5" fill="#94a3b8" />
  </g>

  <!-- أيقونة بريد سريعة صغيرة عائمة -->
  <g filter="url(#softShadow)">
    <circle cx="390" cy="260" r="22" fill="url(#contactBlue)" />
    <rect x="380" y="252" width="20" height="15" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8" />
    <path d="M380,253 L390,261 L400,253" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ذرات وعناصر جمالية عائمة -->
  <circle cx="320" cy="65" r="6" fill="#38cf9d" opacity="0.6" />
  <circle cx="110" cy="250" r="4" fill="#394bee" opacity="0.4" />
  <circle cx="280" cy="380" r="5" fill="#38cf9d" opacity="0.5" />
</svg>
